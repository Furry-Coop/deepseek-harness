# Keyless replay patch over the scenario's live composition. Main chunks derive
# from the committed session; the auxiliary title route consumes the scenario's
# replay override with pacing, and the official provider targets that route.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay-main
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        overrideFile: ./.missing-main-replay-override.json
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

    - id: llm-replay-title
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        paceMs: 10
        providers:
          - id: title-replay
            name: Title replay
            models:
              - id: title-model

    - id: session-title-provider
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: title-replay
        model: title-model
