# TypeScript SDK snapshot patch over `dsh --profile sdk`: a controlled model
# boundary, the held first pre-step that closes the opening turn empty, and a
# platform-neutral composition so the fixture replays on macOS and Linux.

# The fixture corpus must not depend on the developer's personal skill roots.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

# The account adapter loads without credentials; the scenario fixture answers
# every request, so this provider never reaches the network.
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# The scenario exercises wake timing, not shell execution, skill discovery, or
# wall-clock sampling. Each of these contributes platform-dependent prompt text,
# tools, or catalog entries that the recorded session must not pin.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-skill
  disabled: true

- id: time-context
  disabled: true

- insert:
    - id: first-step-wake-fixture
      name: './first-step-wake.mjs'
